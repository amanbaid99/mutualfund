name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Allow GITHUB_TOKEN to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish, but drop any queued runs behind the newest.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Project pages are served from /<repo>/. Set this to "/" if you
          # move the site to a custom domain or a <user>.github.io repo.
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Add SPA + Jekyll guards
        run: |
          # GitHub Pages runs Jekyll by default, which ignores _-prefixed files.
          touch dist/.nojekyll
          # Serve index.html for unknown paths so deep links do not 404.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
